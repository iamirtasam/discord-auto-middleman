<title id="t">Architecture diagram</title>
<desc id="d">index.js boots handlers and events; ready.js and interactionCreate.js use functions (trade.js, ui.js, createPanel.js, logger.js, emojis); these call Tatum, Litecoin Space, CoinGecko, trades.json, MongoDB, Discord webhooks and Discord REST.</desc>
