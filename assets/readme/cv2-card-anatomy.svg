="12" class="gx"/><text x="590" y="532" class="dk" text-anchor="middle">10</text><text x="616" y="526" class="gt" text-anchor="start">.foot(text, {ts})</text><text x="616" y="543" class="m" text-anchor="start">TextDisplay "-# footer • &lt;t:ts:R&gt;"</text><path d="M524 574H574" class="ds"/><rect x="60" y="624" width="1000" height="52" rx="8" class="bx"/><text x="560" y="646" class="h" text-anchor="middle">.msg({ ephemeral, files, allowPing })  →  { components:[container], flags: IsComponentsV2 | Ephemeral, allowedMentions }</text><text x="560" y="664" class="m" text-anchor="middle">no content: beside CV2 · never components: [] · pings opt-in via allowPing</text>
