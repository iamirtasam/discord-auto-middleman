<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Components V2 card anatomy</title>
<desc id="d">Annotated cutaway of one rendered CV2 card: accent bar, H1 title, H2/H3 headings, text nodes, divider, fields, section with thumbnail, media gallery, action row and footer, each mapped to the Card method in functions/ui.js that emits it.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ec42c"/><stop offset="1" stop-color="#00b300"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1ec42c"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ED4245"/></marker>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#e6ffe9;font-size:12px}
.m{fill:#8fbf96;font-size:11px}
.h{font-size:13px;font-weight:700}
.big{font-size:15px;font-weight:700}
.gt{fill:#1ec42c;font-weight:700}
.rt{fill:#ED4245;font-weight:700}
.dk{fill:#04130a;font-weight:700}
.bx{fill:#15201a;stroke:#1ec42c;stroke-width:1.5}
.gx{fill:url(#g)}
.rx{fill:#2a1416;stroke:#ED4245;stroke-width:1.5}
.ln{stroke:#1ec42c;stroke-width:1.6;fill:none}
.lr{stroke:#ED4245;stroke-width:1.6;fill:none}
.ds{stroke:#1ec42c;stroke-width:1;stroke-dasharray:4 4;fill:none;opacity:.55}
.pn{fill:#101613;stroke:#1ec42c;stroke-width:1;stroke-dasharray:5 4;opacity:.8}
</style>
<rect width="1100" height="700" rx="14" fill="#101613"/>
<rect x="60" y="50" width="460" height="550" rx="10" fill="#15201a" stroke="#1ec42c" stroke-opacity=".5"/><rect x="60" y="50" width="8" height="550" rx="3" fill="url(#g)"/><text x="90" y="100" style="font-size:22px;font-weight:800">Payment Invoice</text><text x="90" y="142" style="font-size:16px;font-weight:700">Next steps</text><text x="90" y="164" style="font-size:13px;font-weight:700">Details</text><text x="90" y="198" class="" text-anchor="start">COPY and PASTE the EXACT AMOUNT</text><text x="90" y="218" class="m" text-anchor="start">&gt; fine print</text><path d="M90 238H500" stroke="#1ec42c" stroke-opacity=".6" stroke-width="1.2"/><text x="90" y="268" style="font-size:12px"><tspan font-weight="700">Address:</tspan> L…escrow</text><text x="90" y="288" style="font-size:12px"><tspan font-weight="700">LTC:</tspan> 0.12345678</text><text x="90" y="332" class="" text-anchor="start">Section text node</text><text x="90" y="352" class="m" text-anchor="start">second line of text</text><rect x="436" y="312" width="64" height="64" rx="8" fill="none" stroke="#1ec42c" stroke-width="1.5"/><path d="M446 366l16-20 12 14 8-9 10 15z" fill="#1ec42c" fill-opacity=".6"/><rect x="90" y="402" width="130" height="80" rx="6" fill="#101613" stroke="#1ec42c" stroke-opacity=".7"/><path d="M120 462l24-30 18 20 12-12 20 22z" fill="#1ec42c" fill-opacity=".45"/><rect x="235" y="402" width="130" height="80" rx="6" fill="#101613" stroke="#1ec42c" stroke-opacity=".7"/><path d="M265 462l24-30 18 20 12-12 20 22z" fill="#1ec42c" fill-opacity=".45"/><rect x="380" y="402" width="130" height="80" rx="6" fill="#101613" stroke="#1ec42c" stroke-opacity=".7"/><path d="M410 462l24-30 18 20 12-12 20 22z" fill="#1ec42c" fill-opacity=".45"/><rect x="90" y="506" width="96" height="34" rx="6" fill="url(#g)"/><text x="138" y="527" class="dk" text-anchor="middle">Paste</text><rect x="196" y="506" width="106" height="34" rx="6" fill="#101613" stroke="#1ec42c"/><text x="249" y="527" class="h" text-anchor="middle">Show QR</text><text x="90" y="578" class="m" text-anchor="start">-# footer · 5 minutes ago</text><circle cx="34" cy="62" r="12" class="gx"/><text x="34" y="66" class="dk" text-anchor="middle">1</text><circle cx="34" cy="94" r="12" class="gx"/><text x="34" y="98" class="dk" text-anchor="middle">2</text><circle cx="34" cy="140" r="12" class="gx"/><text x="34" y="144" class="dk" text-anchor="middle">3</text><circle cx="34" cy="194" r="12" class="gx"/><text x="34" y="198" class="dk" text-anchor="middle">4</text><circle cx="34" cy="238" r="12" class="gx"/><text x="34" y="242" class="dk" text-anchor="middle">5</text><circle cx="34" cy="278" r="12" class="gx"/><text x="34" y="282" class="dk" text-anchor="middle">6</text><circle cx="34" cy="346" r="12" class="gx"/><text x="34" y="350" class="dk" text-anchor="middle">7</text><circle cx="34" cy="442" r="12" class="gx"/><text x="34" y="446" class="dk" text-anchor="middle">8</text><circle cx="34" cy="523" r="12" class="gx"/><text x="34" y="527" class="dk" text-anchor="middle">9</text><circle cx="34" cy="574" r="12" class="gx"/><text x="34" y="578" class="dk" text-anchor="middle">10</text><circle cx="590" cy="78" r="12" class="gx"/><text x="590" y="82" class="dk" text-anchor="middle">1</text><text x="616" y="76" class="gt" text-anchor="start">UI.card(COLORS.x)</text><text x="616" y="93" class="m" text-anchor="start">container + accent bar; .spoiler() blurs the whole card</text><path d="M524 62H574" class="ds"/><circle cx="590" cy="128" r="12" class="gx"/><text x="590" y="132" class="dk" text-anchor="middle">2</text><text x="616" y="126" class="gt" text-anchor="start">.title(text, emoji?)</text><text x="616" y="143" class="m" text-anchor="start">TextDisplay "# …" (H1)</text><path d="M524 94H574" class="ds"/><circle cx="590" cy="178" r="12" class="gx"/><text x="590" y="182" class="dk" text-anchor="middle">3</text><text x="616" y="176" class="gt" text-anchor="start">.heading(text, {level})</text><text x="616" y="193" class="m" text-