− fee  (quirk 03)</text><path d="M400 362H560" class="ln" marker-end="url(#a)"/><text x="480.0" y="356" class="" text-anchor="middle">ltcTransferBlockchain</text><text x="480.0" y="377" class="m" text-anchor="middle">from escrow addr/key → receiver</text><path d="M560 412H400" class="ln" marker-end="url(#a)"/><text x="480.0" y="406" class="" text-anchor="middle">data.txId</text><path d="M400 456H885" class="ln" marker-end="url(#a)"/><text x="642.5" y="450" class="" text-anchor="middle">Funds Released card</text><text x="642.5" y="471" class="m" text-anchor="middle">txid → live.blockcypher.com/ltc/tx/{txid}</text><path d="M400 506H1030" class="ln" marker-end="url(#a)"/><text x="715.0" y="500" class="" text-anchor="middle">logHandler('logs') → payment_webhook</text><path d="M400 550H1030" class="ln" marker-end="url(#a)"/><text x="715.0" y="544" class="" text-anchor="middle">logHandler('transcript') + HTML file</text><path d="M400 594H885" class="ln" marker-end="url(#a)"/><text x="642.5" y="588" class="" text-anchor="middle">client_role + Transcript Manager card</text><path d="M400 638H885" class="ln" marker-end="url(#a)"/><text x="642.5" y="632" class="" text-anchor="middle">after 24 h: thread.delete()</text><text x="560" y="784" class="m" text-anchor="middle">refund (Cancel) uses the same sendLTC machinery with the sender address</text>
