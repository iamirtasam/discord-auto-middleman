<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Payout sequence diagram</title>
<desc id="d">Sequence: sender confirms release, receiver supplies LTC address, bot checks balance on BlockCypher, sends via Tatum ltcTransferBlockchain, posts Funds Released card, then payment and transcript webhooks, client role assignment and thread deletion after 24 hours.</desc>
