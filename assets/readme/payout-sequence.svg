.ds{stroke:#1ec42c;stroke-width:1;stroke-dasharray:4 4;fill:none;opacity:.55}
.pn{fill:#101613;stroke:#1ec42c;stroke-width:1;stroke-dasharray:5 4;opacity:.8}
</style>
