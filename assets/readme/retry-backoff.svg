<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Retry and backoff</title>
<desc id="d">Tatum: 3 attempts spaced 5 seconds. BlockCypher: 3 attempts with exponential backoff 2^n seconds and token rotation. CryptoCompare: 3 attempts. Final failure surfaces upstream.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ec42c"/><stop offset="1" stop-color="#00b300"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1ec42c"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ED4245"/></marker>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#e6ffe9;font-size:12px}
.m{fill:#8fbf96;font-size:11px}
.h{font-size:13px;font-weight:700}
.big{font-size:15px;font-weight:700}
.gt{fill:#1ec42c;font-weight:700}
.rt{fill:#ED4245;font-weight:700}
.dk{fill:#04130a;font-weight:700}
.bx{fill:#15201a;stroke:#1ec42c;stroke-width:1.5}
.gx{fill:url(#g)}
.rx{fill:#2a1416;stroke:#ED4245;stroke-width:1.5}
.ln{stroke:#1ec42c;stroke-width:1.6;fill:none}
.lr{stroke:#ED4245;stroke-width:1.6;fill:none}
.ds{stroke:#1ec42c;stroke-width:1;stroke-dasharray:4 4;fill:none;opacity:.55}
.pn{fill:#101613;stroke:#1ec42c;stroke-width:1;stroke-dasharray:5 4;opacity:.8}
</style>
<rect width="1100" height="400" rx="14" fill="#101613"/>
<text x="30" y="68" class="h" text-anchor="start">Tatum</text><text x="30" y="86" class="m" text-anchor="start">×3 · 5 s spacing</text><rect x="230" y="48" width="100" height="48" rx="8" class="bx"/><text x="280" y="68" class="h" text-anchor="middle">attempt</text><text x="280" y="85" class="m" text-anchor="middle">#1</text><path d="M330 72H420" class="ln" marker-end="url(#a)"/><text x="375" y="64" class="m" text-anchor="middle">wait 5 s</text><rect x="420" y="48" width="100" height="48" rx="8" class="bx"/><text x="470" y="68" class="h" text-anchor="middle">attempt</text><text x="470" y="85" class="m" text-anchor="middle">#2</text><path d="M520 72H610" class="ln" marker-end="url(#a)"/><text x="565" y="64" class="m" text-anchor="middle">wait 5 s</text><rect x="610" y="48" width="100" height="48" rx="8" class="bx"/><text x="660" y="68" class="h" text-anchor="middle">attempt</text><text x="660" y="85" class="m" text-anchor="middle">#3</text><path d="M710 72H760" class="lr" marker-end="url(#ar)"/><text x="770" y="76" class="rt" text-anchor="start">throw → thread guidance (/help)</text><text x="30" y="168" class="h" text-anchor="start">BlockCypher</text><text x="30" y="186" class="m" text-anchor="start">×3 · backoff 2^n s</text><rect x="230" y="148" width="100" height="48" rx="8" class="bx"/><text x="280" y="168" class="h" text-anchor="middle">attempt</text><text x="280" y="185" class="m" text-anchor="middle">#1</text><path d="M330 172H420" class="ln" marker-end="url(#a)"/><text x="375" y="164" class="m" text-anchor="middle">wait 2^n s</text><rect x="420" y="148" width="100" height="48" rx="8" class="bx"/><text x="470" y="168" class="h" text-anchor="middle">attempt</text><text x="470" y="185" class="m" text-anchor="middle">#2</text><path d="M520 172H610" class="ln" marker-end="url(#a)"/><text x="565" y="164" class="m" text-anchor="middle">wait 2^n s</text><rect x="610" y="148" width="100" height="48" rx="8" class="bx"/><text x="660" y="168" class="h" text-anchor="middle">attempt</text><text x="660" y="185" class="m" text-anchor="middle">#3</text><path d="M710 172H760" class="lr" marker-end="url(#ar)"/><text x="770" y="176" class="rt" text-anchor="start">error surfaces upstream</text><text x="30" y="268" class="h" text-anchor="start">CryptoCompare</text><text x="30" y="286" class="m" text-anchor="start">×3 attempts</text><rect x="230" y="248" width="100" height="48" rx="8" class="bx"/><text x="280" y="268" class="h" text-anchor="middle">attempt</text><text x="280" y="285" class="m" text-anchor="middle">#1</text><path d="M330 272H420" class="ln" marker-end="url(#a)"/><text x="375" y="264" class="m" text-anchor="middle">retry</text><rect x="420" y="248" width="100" height="48" rx="8" class="bx"/><text x="470" y="268" class="h" text-anchor="middle">attempt</text><text x="470" y="285" class="m" text-anchor="middle">#2</text><path d="M520 272H610" class="ln" marker-end="url(#a)"/><text x="565" y="264" class="m" text-anchor="middle">retry</text><rect x="610" y="248" width="100" height="48" rx="8" class="bx"/><text x="660" y="268" class="h" text-anchor="middle">attempt</text><text x="660" y="285" class="m" text-anchor="middle">#3</text><path d="M710 272H760" class="lr" marker-end="url(#ar)"/><text x="770" y="276" class="rt" text-anchor="start">null / error surfaces upstream</text><rect x="230" y="334" width="480" height="40" rx="8" class="pn"/><text x="470" y="358" class="m" text-anchor="middle">BlockCypher: random token from apiToken[], never the same one twice in a row</text>
</svg>
