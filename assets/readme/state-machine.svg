ss="gt" text-anchor="middle">Releasesd Funds at {address}</text><rect x="830" y="255" width="150" height="60" rx="8" class="bx"/><text x="905.0" y="281.0" class="h" text-anchor="middle">Closed</text><text x="905.0" y="297.0" class="m" text-anchor="middle">thread deleted</text><path d="M770 246L830 275" class="ln" marker-end="url(#a)"/><path d="M770 316L830 290" class="lr" marker-end="url(#ar)"/><text x="1040" y="345" class="m" text-anchor="middle">after webhooks + 24 h</text><text x="1040" y="359" class="m" text-anchor="middle">cleanup</text><text x="600" y="440" class="m" text-anchor="middle">Strings are shown verbatim from the source, typos included. Each persisted mutation calls saveState() (trades.json).</text>
