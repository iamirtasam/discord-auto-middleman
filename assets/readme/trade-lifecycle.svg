<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1640" width="920" height="1640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Escrow trade lifecycle</title>
<desc id="d">Vertical flowchart Stage 0 to Stage 9: panels, thread, roles, currency and amount, escrow address, invoice, deposit detection with an under-payment decision (Send More or Continue), confirmations, wallet actions forking into Release or Cancel, converging on webhook logs, client role and 24 hour thread cleanup.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1ec42c"/><stop offset="1" stop-color="#00b300"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1ec42c"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ED4245"/></marker>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#e6ffe9;font-size:12px}
.m{fill:#8fbf96;font-size:11px}
.h{font-size:13px;font-weight:700}
.big{font-size:15px;font-weight:700}
.gt{fill:#1ec42c;font-weight:700}
.rt{fill:#ED4245;font-weight:700}
.dk{fill:#04130a;font-weight:700}
.bx{fill:#15201a;stroke:#1ec42c;stroke-width:1.5}
.gx{fill:url(#g)}
.rx{fill:#2a1416;stroke:#ED4245;stroke-width:1.5}
.ln{stroke:#1ec42c;stroke-width:1.6;fill:none}
.lr{stroke:#ED4245;stroke-width:1.6;fill:none}
.ds{stroke:#1ec42c;stroke-width:1;stroke-dasharray:4 4;fill:none;opacity:.55}
.pn{fill:#101613;stroke:#1ec42c;stroke-width:1;stroke-dasharray:5 4;opacity:.8}
</style>
<rect width="920" height="1640" rx="14" fill="#101613"/>
<rect x="190" y="30" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="62.0" r="14" class="gx"/><text x="216" y="66.0" class="dk" text-anchor="middle">0</text><text x="242" y="59.0" class="h" text-anchor="start">Stage 0 · Panels</text><text x="242" y="76.0" class="m" text-anchor="start">/panels → panel + status + admin card</text><path d="M370 94V134" class="ln" marker-end="url(#a)"/><rect x="190" y="134" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="166.0" r="14" class="gx"/><text x="216" y="170.0" class="dk" text-anchor="middle">1</text><text x="242" y="163.0" class="h" text-anchor="start">Stage 1 · Thread creation</text><text x="242" y="180.0" class="m" text-anchor="start">create_new_deal → private thread</text><path d="M370 198V238" class="ln" marker-end="url(#a)"/><rect x="190" y="238" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="270.0" r="14" class="gx"/><text x="216" y="274.0" class="dk" text-anchor="middle">2</text><text x="242" y="267.0" class="h" text-anchor="start">Stage 2 · Roles</text><text x="242" y="284.0" class="m" text-anchor="start">partner ID → sender/receiver → Confirm</text><path d="M370 302V342" class="ln" marker-end="url(#a)"/><rect x="190" y="342" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="374.0" r="14" class="gx"/><text x="216" y="378.0" class="dk" text-anchor="middle">3</text><text x="242" y="371.0" class="h" text-anchor="start">Stage 3 · Currency &amp; amount</text><text x="242" y="388.0" class="m" text-anchor="start">EUR/USD confirm → deal amount</text><path d="M370 406V446" class="ln" marker-end="url(#a)"/><rect x="190" y="446" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="478.0" r="14" class="gx"/><text x="216" y="482.0" class="dk" text-anchor="middle">4</text><text x="242" y="475.0" class="h" text-anchor="start">Stage 4 · Escrow address</text><text x="242" y="492.0" class="m" text-anchor="start">Tatum xpub index → address + key</text><path d="M370 510V550" class="ln" marker-end="url(#a)"/><rect x="190" y="550" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="582.0" r="14" class="gx"/><text x="216" y="586.0" class="dk" text-anchor="middle">5</text><text x="242" y="579.0" class="h" text-anchor="start">Stage 5 · Invoice</text><text x="242" y="596.0" class="m" text-anchor="start">Payment Invoice card · Paste · QR</text><path d="M370 614V654" class="ln" marker-end="url(#a)"/><rect x="190" y="654" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="686.0" r="14" class="gx"/><text x="216" y="690.0" class="dk" text-anchor="middle">6</text><text x="242" y="683.0" class="h" text-anchor="start">Stage 6 · Deposit detection</text><text x="242" y="700.0" class="m" text-anchor="start">Litecoin Space poll · rotating token</text><path d="M370 718V782" class="ln" marker-end="url(#a)"/><path d="M220 830L370 782L520 830L370 878Z" class="bx"/><text x="370" y="827" class="h" text-anchor="middle">under-paid?</text><text x="370" y="843" class="m" text-anchor="middle">received &lt; agreed</text><path d="M520 830H600" class="ln" marker-end="url(#a)"/><text x="560" y="822" class="gt" text-anchor="middle">yes</text><rect x="600" y="788" width="290" height="84" rx="8" class="bx"/><text x="745.0" y="818.0" class="h" text-anchor="middle">Amount Mismatch card</text><text x="745.0" y="834.0" class="m" text-anchor="middle">Send More (addmore)</text><text x="745.0" y="850.0" class="m" text-anchor="middle">Continue (continuex)</text><path d="M745 788V686H552" class="ln" marker-end="url(#a)"/><text x="753" y="735" class="m" text-anchor="start">Send More:</text><text x="753" y="749" class="m" text-anchor="start">Updated Invoice</text><text x="753" y="763" class="m" text-anchor="start">(remaining LTC)</text><path d="M745 872V974H552" class="ln" marker-end="url(#a)"/><text x="753" y="915" class="m" text-anchor="start">Continue:</text><text x="753" y="929" class="m" text-anchor="start">proceed with</text><text x="753" y="943" class="m" text-anchor="start">received amount</text><path d="M370 878V942" class="ln" marker-end="url(#a)"/><text x="384" y="916" class="gt" text-anchor="start">no</text><rect x="190" y="942" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="974.0" r="14" class="gx"/><text x="216" y="978.0" class="dk" text-anchor="middle">7</text><text x="242" y="971.0" class="h" text-anchor="start">Stage 7 · Confirmations</text><text x="242" y="988.0" class="m" text-anchor="start">poll until confirmations ≥ 1</text><path d="M520 1006V1080H598" class="ln" marker-end="url(#a)"/><text x="528" y="1034" class="m" text-anchor="start">nothing</text><text x="528" y="1048" class="m" text-anchor="start">detected</text><rect x="600" y="1030" width="290" height="100" rx="8" class="bx"/><text x="745.0" y="1060.0" class="h" text-anchor="middle">Transaction Not Detected</text><text x="745.0" y="1076.0" class="m" text-anchor="middle">Re-scan → detection loop</text><text x="745.0" y="1092.0" class="m" text-anchor="middle">close_trade → refund / close</text><text x="745.0" y="1108.0" class="m" text-anchor="middle">80 min decision window</text><path d="M370 1006V1050" class="ln" marker-end="url(#a)"/><rect x="190" y="1050" width="360" height="64" rx="8" class="bx"/><circle cx="216" cy="1082.0" r="14" class="gx"/><text x="216" y="1086.0" class="dk" text-anchor="middle">8</text><text x="242" y="1079.0" class="h" text-anchor="start">Stage 8 · Wallet actions</text><text x="242" y="1096.0" class="m" text-anchor="start">Release / Cancel · sender only</text><path d="M370 1114V1150" class="ln"/><path d="M370 1150H185V1176" class="ln" marker-end="url(#a)"/><path d="M370 1150H555V1176" class="lr" marker-end="url(#ar)"/><text x="110" y="1143" class="gt" text-anchor="middle">Release</text><text x="600" y="1143" class="rt" text-anchor="middle">Cancel</text><rect x="20" y="1176" width="330" height="140" rx="8" class="bx"/><text x="185.0" y="1210.0" class="h" text-anchor="middle">Stage 9 · Release</text><text x="185.0" y="1226.0" class="m" text-anchor="middle">confirmRelease (Yes! / No!)</text><text x="185.0" y="1242.0" class="m" text-anchor="middle">receiver types LTC address</text><text x="185.0" y="1258.0" class="m" text-anchor="middle">sender confirms the address</text><text x="185.0" y="1274.0" class="m" text-anchor="middle">sendLTC → Tatum transfer</text><text x="185.0" y="1290.0" class="m" text-anchor="middle">Funds Released card</text><rect x="390" y="1176" width="330" height="140" rx="8" class="rx"/><text x="555.0" y="1218.0" class="h" text-anchor="middle">Cancel · refund</text><text x="555.0" y="1234.0" class="m" text-anchor="middle">confirmCancel (both parties)</text><text x="555.0" y="1250.0" class="m" text-anchor="middle">Trade Canceled card</text><text x="555.0" y="1266.0" class="m" text-anchor="middle">sender types LTC address</text><text x="555.0" y="1282.0" class="m" text-anchor="middle">confirm → refund sweep (sendLTC)</text><path d="M185 1316V1350H370" class="ln"/><path d="M555 1316V1350H370" class="lr"/><path d="M370 1350V1384" class="ln" marker-end="url(#a)"/><rect x="190" y="1384" width="360" height="56" rx="8" class="bx"/><text x="370.0" y="1408.0" class="h" text-anchor="middle">Webhook logs</text><text x="370.0" y="1424.0" class="m" text-anchor="middle">payment_webhook + transcript_webhook</text><path d="M370 1440V1470" class="ln" marker-end="url(#a)"/><rect x="190" y="1470" width="360" height="56" rx="8" class="bx"/><text x="370.0" y="1494.0" class="h" text-anchor="middle">Client role</text><text x="370.0" y="1510.0" class="m" text-anchor="middle">client_role → both parties (if set)</text><path d="M370 1526V1556" class="ln" marker-end="url(#a)"/><rect x="190" y="1556" width="360" height="56" rx="8" class="bx"/><text x="370.0" y="1580.0" class="h" text-anchor="middle">24 h cleanup</text><text x="370.0" y="1596.0" class="m" text-anchor="middle">thread.delete()</text>
</svg>
